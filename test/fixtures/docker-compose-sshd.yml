services:
  sshd:
    image: linuxserver/openssh-server:latest
    container_name: chisa-test-sshd
    environment:
      - PUID=0
      - PGID=0
      - USER_NAME=root
      - USER_PASSWORD=testpass
      - PASSWORD_ACCESS=true
      - TZ=Asia/Shanghai
    ports:
      - "2222:2222"
    volumes:
      - ./sshd-data:/config
      - ./sshd-set-root.sh:/custom-cont-init.d/99-set-root.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
