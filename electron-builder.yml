appId: com.chisa.terminal
productName: ChisaTerminal
directories:
  output: dist-build
files:
  - dist/**/*
  - hooks/**/*
  - package.json
  - node_modules/**/*
asar: true
asarUnpack:
  - hooks/**/*
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronDownload:
  cache: "${env.ELECTRON_CACHE}"
